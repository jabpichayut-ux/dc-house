<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DC House — ยาม</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet" />
 
  <style>
    :root {
      --warm-white:   #FAF8F4;
      --cream:        #F4F0E8;
      --gold:         #C9A84C;
      --gold-light:   #E2C97E;
      --gold-dark:    #9E7A2E;
      --charcoal:     #1A1A1A;
      --ink:          #2C2C2C;
      --muted:        #888880;
      --divider:      #E0D8C8;
      --green-bg:     #EAF5EE;
      --green-text:   #2A7A4B;
      --green-border: #B8DEC6;
      --red-bg:       #FAEAEA;
      --red-text:     #B33030;
      --red-border:   #E8B8B8;
      --card-shadow:  0 2px 12px rgba(0,0,0,0.06);
      --radius:       10px;
    }
 
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
    html, body {
      font-family: 'Prompt', sans-serif;
      background: var(--warm-white);
      color: var(--ink);
      height: 100vh;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
 
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
 
    /* ─── Header ─────────────────────────────────────────── */
    header {
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 56px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--divider);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
 
    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
 
    .header-logo {
      height: 36px;
      width: auto;
      object-fit: contain;
    }
 
    .header-subtitle {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.08em;
      border-left: 1px solid var(--divider);
      padding-left: 16px;
    }
 
    .header-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }
 
    .stats-inline {
      display: flex;
      gap: 16px;
      font-size: 13px;
      font-weight: 600;
    }
 
    .stat-in  { color: var(--green-text); }
    .stat-out { color: var(--red-text); }
 
    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--gold-dark);
      font-weight: 600;
    }
 
    .live-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #4CAF50;
      animation: pulse 2s infinite;
    }
 
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(76,175,80,0.6); }
      70%  { box-shadow: 0 0 0 6px rgba(76,175,80,0); }
      100% { box-shadow: 0 0 0 0 rgba(76,175,80,0); }
    }
 
    .last-updated {
      font-size: 11px;
      color: var(--muted);
    }
 
    /* ─── 3 Columns ──────────────────────────────────────── */
    .columns {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      flex: 1;
      overflow: hidden;
    }
 
    .column {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--divider);
      overflow: hidden;
    }
    .column:last-child { border-right: none; }
 
    .column-header {
      background: var(--cream);
      padding: 10px 16px;
      border-bottom: 1px solid var(--divider);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
 
    .column-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--charcoal);
      letter-spacing: 0.04em;
    }
 
    .column-count {
      font-size: 11px;
      color: var(--muted);
    }
 
    .column-body {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
 
    /* ─── Car Card ───────────────────────────────────────── */
    .car-card {
      background: #fff;
      border-radius: var(--radius);
      border: 1.5px solid var(--divider);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: var(--card-shadow);
    }
 
    .car-card.is-in  { border-color: var(--green-border); }
    .car-card.is-out { border-color: var(--red-border); }
 
    .car-photo {
      width: 52px;
      height: 36px;
      object-fit: contain;
      border-radius: 6px;
      flex-shrink: 0;
    }
 
    .car-info {
      flex: 1;
      min-width: 0;
    }
 
    .car-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--charcoal);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }
 
    .car-plate {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.06em;
      margin-top: 1px;
    }
 
    /* ─── Toggle Button ──────────────────────────────────── */
    .toggle-btn {
      flex-shrink: 0;
      width: 58px;
      height: 32px;
      border-radius: 20px;
      border: none;
      font-family: 'Prompt', sans-serif;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
 
    .toggle-btn.in {
      background: var(--green-bg);
      color: var(--green-text);
      border: 1.5px solid var(--green-border);
    }
 
    .toggle-btn.out {
      background: var(--red-bg);
      color: var(--red-text);
      border: 1.5px solid var(--red-border);
    }
 
    .toggle-btn:active { transform: scale(0.93); }
    .toggle-btn.loading { opacity: 0.45; pointer-events: none; }
 
    /* ─── Flash ──────────────────────────────────────────── */
    @keyframes flashGreen {
      0%   { background: #B8DEC6; }
      100% { background: #fff; }
    }
    @keyframes flashRed {
      0%   { background: #E8B8B8; }
      100% { background: #fff; }
    }
    .car-card.flash-in  { animation: flashGreen 0.5s ease; }
    .car-card.flash-out { animation: flashRed   0.5s ease; }
 
    /* ─── Loading ────────────────────────────────────────── */
    .loading-row {
      padding: 24px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
 
    /* ─── Toast ──────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--charcoal);
      color: #fff;
      font-family: 'Prompt', sans-serif;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 28px;
      border-radius: 40px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      transition: transform 0.3s ease;
      z-index: 999;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
<div class="app">
 
  <!-- Header -->
  <header>
    <div class="header-left">
      <img src="logo.png" alt="DC House" class="header-logo" />
      <div class="header-subtitle">หน้าจอยาม</div>
    </div>
    <div class="header-right">
      <div class="stats-inline">
        <span class="stat-in">🟢 อยู่ในบ้าน: <span id="count-in">—</span></span>
        <span class="stat-out">🔴 ออกไปแล้ว: <span id="count-out">—</span></span>
      </div>
      <div class="last-updated" id="last-updated">—</div>
      <div class="live-badge"><div class="live-dot"></div>Live</div>
    </div>
  </header>
 
  <!-- 3 Columns -->
  <div class="columns">
 
    <div class="column">
      <div class="column-header">
        <div class="column-title">🚌 รถสาธารณะ</div>
        <div class="column-count">16 คัน</div>
      </div>
      <div class="column-body" id="col-1"></div>
    </div>
 
    <div class="column">
      <div class="column-header">
        <div class="column-title">🚗 รถ Generation 2</div>
        <div class="column-count">8 คัน</div>
      </div>
      <div class="column-body" id="col-2"></div>
    </div>
 
    <div class="column">
      <div class="column-header">
        <div class="column-title">🚙 รถ Generation 3</div>
        <div class="column-count">10 คัน</div>
      </div>
      <div class="column-body" id="col-3"></div>
    </div>
 
  </div>
</div>
 
<div class="toast" id="toast"></div>
 
<script>
  const PROXY_URL  = 'https://script.google.com/macros/s/AKfycby4SlIYGdaXgvnTaJacZ3Cby-rpCu4ZwKGJqQmEcUgJUvTGRFu1GUvXCReb1jOdukPXog/exec';
  const SECRET_KEY = 'dc-house-2026';
  const REFRESH_INTERVAL = 30 * 1000;
 
  const GROUPS = [
    { id: 'col-1', start: 0,  end: 15 },
    { id: 'col-2', start: 16, end: 23 },
    { id: 'col-3', start: 24, end: 33 },
  ];
 
  let carsData = [];
 
  async function fetchData() {
    try {
      const res  = await fetch(`${PROXY_URL}?key=${SECRET_KEY}&t=${Date.now()}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      carsData = data.cars;
      renderAll(data.cars);
    } catch (err) {
      GROUPS.forEach(g => {
        document.getElementById(g.id).innerHTML = `<div class="loading-row">⚠️ โหลดไม่ได้</div>`;
      });
    }
  }
 
  function renderAll(cars) {
    let totalIn = 0, totalOut = 0;
 
    GROUPS.forEach(g => {
      const slice     = cars.slice(g.start, g.end + 1);
      const container = document.getElementById(g.id);
 
      const html = slice.map((car, li) => {
        const globalIndex = g.start + li;
        const isIn  = car.status === 'in';
        const color = isIn ? '#2A7A4B' : '#B33030';
        if (isIn) totalIn++; else totalOut++;
 
        return `
          <div class="car-card ${isIn ? 'is-in' : 'is-out'}" id="card-${globalIndex}">
            <img
              class="car-photo"
              src="${escapeHTML(car.photo || '')}"
              onerror="this.style.display='none'"
              style="border:2px solid ${color};"
            />
            <div class="car-info">
              <div class="car-name">${escapeHTML(car.name)}</div>
              <div class="car-plate">${escapeHTML(car.plate)}</div>
            </div>
            <button
              class="toggle-btn ${isIn ? 'in' : 'out'}"
              id="btn-${globalIndex}"
              onclick="toggleStatus(${globalIndex})"
            >${isIn ? 'IN' : 'OUT'}</button>
          </div>`;
      }).join('');
 
      container.innerHTML = html || '<div class="loading-row">ไม่พบข้อมูล</div>';
    });
 
    document.getElementById('count-in').textContent  = totalIn;
    document.getElementById('count-out').textContent = totalOut;
    const now = new Date();
    document.getElementById('last-updated').textContent =
      'อัพเดต ' + now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
  }
 
  async function toggleStatus(index) {
    const car       = carsData[index];
    const newStatus = car.status === 'in' ? 'out' : 'in';
    const btn       = document.getElementById(`btn-${index}`);
    const card      = document.getElementById(`card-${index}`);
 
    btn.classList.add('loading');
    btn.textContent = '…';
 
    try {
      const res = await fetch(
        `${PROXY_URL}?key=${SECRET_KEY}&action=update&row=${index + 2}&status=${newStatus}&t=${Date.now()}`
      );
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
 
      carsData[index].status = newStatus;
 
      const isIn  = newStatus === 'in';
      const color = isIn ? '#2A7A4B' : '#B33030';
 
      btn.classList.remove('loading', 'in', 'out');
      btn.classList.add(isIn ? 'in' : 'out');
      btn.textContent = isIn ? 'IN' : 'OUT';
 
      card.classList.remove('is-in', 'is-out');
      card.classList.add(isIn ? 'is-in' : 'is-out');
 
      const photo = card.querySelector('.car-photo');
      if (photo) photo.style.border = `2px solid ${color}`;
 
      card.classList.add(isIn ? 'flash-in' : 'flash-out');
      setTimeout(() => card.classList.remove('flash-in', 'flash-out'), 600);
 
      let totalIn = 0, totalOut = 0;
      carsData.forEach(c => c.status === 'in' ? totalIn++ : totalOut++);
      document.getElementById('count-in').textContent  = totalIn;
      document.getElementById('count-out').textContent = totalOut;
 
      showToast(`${car.name} → ${isIn ? 'เข้า ✅' : 'ออก 🔴'}`);
 
    } catch (err) {
      btn.classList.remove('loading');
      btn.textContent = car.status === 'in' ? 'IN' : 'OUT';
      showToast('⚠️ อัพเดตไม่สำเร็จ');
    }
  }
 
  let toastTimer;
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
  }
 
  function escapeHTML(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
 
  fetchData();
  setInterval(fetchData, REFRESH_INTERVAL);
</script>
</body>
</html>
