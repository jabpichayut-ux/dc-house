<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DC House — พัสดุ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet" />
 
  <style>
    :root {
      --warm-white:  #FAF8F4;
      --cream:       #F4F0E8;
      --gold:        #C9A84C;
      --gold-light:  #E2C97E;
      --gold-dark:   #9E7A2E;
      --charcoal:    #1A1A1A;
      --ink:         #2C2C2C;
      --muted:       #888880;
      --divider:     #E0D8C8;
      --green-bg:    #EAF5EE;
      --green-text:  #2A7A4B;
      --green-border:#B8DEC6;
      --card-shadow: 0 2px 16px rgba(0,0,0,0.06);
      --radius:      12px;
    }
 
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
    html, body {
      font-family: 'Prompt', sans-serif;
      background: var(--warm-white);
      color: var(--ink);
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }
 
    /* ── Header ── */
    header {
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--divider);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
 
    .header-logo {
      height: 36px;
      width: auto;
      object-fit: contain;
    }
 
    .header-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.06em;
    }
 
    /* ── Main ── */
    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 16px 100px;
    }
 
    .page-subtitle {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--divider);
    }
    .page-subtitle span { color: var(--gold); margin: 0 6px; }
 
    /* ── Step indicator ── */
    .steps {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
    }
 
    .step {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }
 
    .step-num {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--divider);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
 
    .step.active .step-num {
      background: var(--gold);
      color: #fff;
    }
    .step.active { color: var(--charcoal); }
    .step.done .step-num {
      background: var(--green-bg);
      color: var(--green-text);
      border: 1px solid var(--green-border);
    }
 
    .step-line {
      flex: 1;
      height: 1px;
      background: var(--divider);
    }
 
    /* ── Section title ── */
    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--charcoal);
      margin-bottom: 12px;
    }
 
    /* ── Search ── */
    .search-box {
      width: 100%;
      border: 1.5px solid var(--divider);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-family: 'Prompt', sans-serif;
      font-size: 14px;
      background: #fff;
      color: var(--ink);
      margin-bottom: 12px;
      transition: border-color 0.15s;
    }
    .search-box:focus { outline: none; border-color: var(--gold); }
 
    /* ── Member list ── */
    .member-list {
      background: #fff;
      border-radius: var(--radius);
      border: 1px solid var(--divider);
      overflow: hidden;
      box-shadow: var(--card-shadow);
      margin-bottom: 24px;
      max-height: 380px;
      overflow-y: auto;
    }
 
    .member-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--divider);
      cursor: pointer;
      transition: background 0.15s;
    }
    .member-item:last-child { border-bottom: none; }
    .member-item:active { background: var(--cream); }
    .member-item.selected {
      background: #FBF6E8;
      border-left: 3px solid var(--gold);
    }
 
    .member-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--charcoal);
    }
 
    .member-check {
      width: 22px; height: 22px;
      border-radius: 50%;
      border: 1.5px solid var(--divider);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .member-item.selected .member-check {
      background: var(--gold);
      border-color: var(--gold);
      color: #fff;
    }
 
    .loading-row {
      padding: 32px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }
 
    /* ── Quantity section ── */
    .quantity-section {
      background: #fff;
      border-radius: var(--radius);
      border: 1px solid var(--divider);
      padding: 20px;
      box-shadow: var(--card-shadow);
      margin-bottom: 24px;
    }
 
    .selected-name-display {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 16px;
    }
    .selected-name-display strong {
      color: var(--gold-dark);
      font-size: 16px;
    }
 
    .quantity-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--charcoal);
      margin-bottom: 10px;
    }
 
    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }
 
    .qty-btn {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 1.5px solid var(--divider);
      background: #fff;
      font-size: 22px;
      font-weight: 300;
      color: var(--charcoal);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .qty-btn:active { background: var(--cream); transform: scale(0.93); }
 
    .qty-display {
      font-size: 36px;
      font-weight: 700;
      color: var(--charcoal);
      min-width: 60px;
      text-align: center;
    }
 
    .qty-unit {
      font-size: 14px;
      color: var(--muted);
    }
 
    /* ── Submit button ── */
    .submit-btn {
      width: 100%;
      background: var(--gold);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 16px;
      font-family: 'Prompt', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s;
      box-shadow: 0 4px 16px rgba(201,168,76,0.35);
      letter-spacing: 0.04em;
    }
    .submit-btn:active { transform: scale(0.98); background: var(--gold-dark); }
    .submit-btn:disabled { opacity: 0.5; pointer-events: none; }
 
    /* ── Success state ── */
    .success-card {
      display: none;
      background: var(--green-bg);
      border: 1px solid var(--green-border);
      border-radius: var(--radius);
      padding: 28px 20px;
      text-align: center;
      margin-bottom: 24px;
    }
    .success-card.show { display: block; }
 
    .success-icon { font-size: 48px; margin-bottom: 12px; }
 
    .success-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--green-text);
      margin-bottom: 6px;
    }
 
    .success-desc {
      font-size: 13px;
      color: var(--green-text);
      opacity: 0.8;
      line-height: 1.6;
    }
 
    .btn-reset {
      margin-top: 16px;
      background: #fff;
      color: var(--green-text);
      border: 1px solid var(--green-border);
      border-radius: 40px;
      padding: 10px 24px;
      font-family: 'Prompt', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-reset:active { transform: scale(0.96); }
 
    /* ── No members warning ── */
    .warning-card {
      background: #FFF8E8;
      border: 1px solid #E8D8A0;
      border-radius: var(--radius);
      padding: 16px 18px;
      font-size: 13px;
      color: var(--gold-dark);
      line-height: 1.6;
      margin-bottom: 16px;
    }
 
    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--charcoal);
      color: #fff;
      font-family: 'Prompt', sans-serif;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 40px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      transition: transform 0.3s ease;
      z-index: 999;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
 
<header>
  <img src="logo.png" alt="DC House" class="header-logo" />
  <div class="header-title">แจ้งพัสดุ</div>
</header>
 
<main>
 
  <p class="page-subtitle">
    DC House<span>·</span>ระบบแจ้งพัสดุ
  </p>
 
  <!-- Step indicator -->
  <div class="steps">
    <div class="step active" id="step1">
      <div class="step-num">1</div>
      เลือกชื่อ
    </div>
    <div class="step-line"></div>
    <div class="step" id="step2">
      <div class="step-num">2</div>
      จำนวน
    </div>
    <div class="step-line"></div>
    <div class="step" id="step3">
      <div class="step-num">3</div>
      ส่งแจ้งเตือน
    </div>
  </div>
 
  <!-- Success card -->
  <div class="success-card" id="success-card">
    <div class="success-icon">📦✅</div>
    <div class="success-title">ส่งแจ้งเตือนแล้ว!</div>
    <div class="success-desc" id="success-desc">—</div>
    <button class="btn-reset" onclick="resetForm()">+ แจ้งพัสดุรายการใหม่</button>
  </div>
 
  <!-- Step 1 — Select member -->
  <div id="section-member">
    <div class="section-title">1. เลือกชื่อผู้รับพัสดุ</div>
 
    <div class="warning-card" id="warning-card" style="display:none">
      ⚠️ ยังไม่มีสมาชิกลงทะเบียน — ให้สมาชิกเพิ่ม LINE OA และพิมพ์ชื่อของตัวเองก่อนค่ะ
    </div>
 
    <input
      class="search-box"
      id="search-box"
      type="text"
      placeholder="🔍 ค้นหาชื่อ..."
      oninput="filterMembers()"
    />
 
    <div class="member-list" id="member-list">
      <div class="loading-row">กำลังโหลด…</div>
    </div>
  </div>
 
  <!-- Step 2 — Quantity -->
  <div id="section-quantity" style="display:none">
    <div class="section-title">2. จำนวนพัสดุ</div>
    <div class="quantity-section">
      <div class="selected-name-display">
        ผู้รับ: <strong id="selected-display">—</strong>
      </div>
      <div class="quantity-label">จำนวนชิ้น</div>
      <div class="quantity-controls">
        <button class="qty-btn" onclick="changeQty(-1)">−</button>
        <div class="qty-display" id="qty-display">1</div>
        <div class="qty-unit">ชิ้น</div>
        <button class="qty-btn" onclick="changeQty(1)">+</button>
      </div>
    </div>
 
    <button class="submit-btn" id="submit-btn" onclick="sendNotification()">
      📨 ส่งแจ้งเตือนไปที่ LINE
    </button>
  </div>
 
</main>
 
<div class="toast" id="toast"></div>
 
<script>
  const PROXY_URL  = 'https://script.google.com/macros/s/AKfycbyV9Zc0ngXcxI1TcUppHDkDG7eeBjnxVeYE3uWXsUZvikaG5blH5baZ00a4M6aX9gi6vQ/exec';
  const SECRET_KEY = 'dc-house-2026';
 
  let allMembers    = [];
  let selectedMember = null;
  let quantity       = 1;
 
  /* ── FETCH MEMBERS ── */
  async function fetchMembers() {
    try {
      const res  = await fetch(`${PROXY_URL}?key=${SECRET_KEY}&action=getMembers&t=${Date.now()}`);
      const data = await res.json();
      allMembers = data.members || [];
      renderMembers(allMembers);
 
      if (!allMembers.length) {
        document.getElementById('warning-card').style.display = 'block';
      }
    } catch (err) {
      document.getElementById('member-list').innerHTML =
        `<div class="loading-row">⚠️ โหลดไม่ได้</div>`;
    }
  }
 
  /* ── RENDER MEMBERS ── */
  function renderMembers(members) {
    const list = document.getElementById('member-list');
    if (!members.length) {
      list.innerHTML = '<div class="loading-row">ไม่พบสมาชิก</div>';
      return;
    }
    list.innerHTML = members.map((m, i) => `
      <div class="member-item" id="member-${i}" onclick="selectMember(${i})">
        <div class="member-name">${escapeHTML(m.name)}</div>
        <div class="member-check" id="check-${i}">✓</div>
      </div>`).join('');
  }
 
  /* ── FILTER MEMBERS ── */
  function filterMembers() {
    const q       = document.getElementById('search-box').value.toLowerCase();
    const filtered = allMembers.filter(m => m.name.toLowerCase().includes(q));
    renderMembers(filtered);
  }
 
  /* ── SELECT MEMBER ── */
  function selectMember(index) {
    const members = getCurrentMembers();
    selectedMember = members[index];
 
    // Update UI
    document.querySelectorAll('.member-item').forEach(el => el.classList.remove('selected'));
    document.getElementById(`member-${index}`).classList.add('selected');
 
    // Show quantity section after short delay
    setTimeout(() => {
      document.getElementById('selected-display').textContent = selectedMember.name;
      document.getElementById('section-quantity').style.display = 'block';
      document.getElementById('section-quantity').scrollIntoView({ behavior: 'smooth', block: 'start' });
 
      // Update steps
      document.getElementById('step1').classList.remove('active');
      document.getElementById('step1').classList.add('done');
      document.getElementById('step1').querySelector('.step-num').textContent = '✓';
      document.getElementById('step2').classList.add('active');
    }, 150);
  }
 
  function getCurrentMembers() {
    const q = document.getElementById('search-box').value.toLowerCase();
    return q ? allMembers.filter(m => m.name.toLowerCase().includes(q)) : allMembers;
  }
 
  /* ── QUANTITY ── */
  function changeQty(delta) {
    quantity = Math.max(1, Math.min(99, quantity + delta));
    document.getElementById('qty-display').textContent = quantity;
  }
 
  /* ── SEND NOTIFICATION ── */
  async function sendNotification() {
    if (!selectedMember) { showToast('กรุณาเลือกชื่อก่อนค่ะ'); return; }
 
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'กำลังส่ง…';
 
    try {
      const res = await fetch(
        `${PROXY_URL}?key=${SECRET_KEY}&action=notify&userId=${encodeURIComponent(selectedMember.userId)}&name=${encodeURIComponent(selectedMember.name)}&quantity=${quantity}&t=${Date.now()}`
      );
      const data = await res.json();
 
      if (data.success) {
        // Show success
        document.getElementById('success-desc').textContent =
          `ส่งแจ้งเตือนถึง คุณ${selectedMember.name} แล้วค่ะ\nพัสดุ ${quantity} ชิ้น`;
        document.getElementById('success-card').classList.add('show');
        document.getElementById('section-member').style.display = 'none';
        document.getElementById('section-quantity').style.display = 'none';
 
        // Update steps
        document.getElementById('step2').classList.remove('active');
        document.getElementById('step2').classList.add('done');
        document.getElementById('step2').querySelector('.step-num').textContent = '✓';
        document.getElementById('step3').classList.add('active');
        document.getElementById('step3').querySelector('.step-num').textContent = '✓';
 
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        throw new Error('ส่งไม่สำเร็จ');
      }
    } catch (err) {
      showToast('⚠️ ส่งไม่สำเร็จ กรุณาลองใหม่');
      btn.disabled = false;
      btn.textContent = '📨 ส่งแจ้งเตือนไปที่ LINE';
    }
  }
 
  /* ── RESET ── */
  function resetForm() {
    selectedMember = null;
    quantity = 1;
 
    document.getElementById('success-card').classList.remove('show');
    document.getElementById('section-member').style.display = 'block';
    document.getElementById('section-quantity').style.display = 'none';
    document.getElementById('search-box').value = '';
    document.getElementById('qty-display').textContent = '1';
 
    // Reset steps
    document.getElementById('step1').classList.add('active');
    document.getElementById('step1').classList.remove('done');
    document.getElementById('step1').querySelector('.step-num').textContent = '1';
    document.getElementById('step2').classList.remove('active', 'done');
    document.getElementById('step2').querySelector('.step-num').textContent = '2';
    document.getElementById('step3').classList.remove('active', 'done');
    document.getElementById('step3').querySelector('.step-num').textContent = '3';
 
    document.getElementById('submit-btn').disabled = false;
    document.getElementById('submit-btn').textContent = '📨 ส่งแจ้งเตือนไปที่ LINE';
 
    renderMembers(allMembers);
  }
 
  /* ── TOAST ── */
  let toastTimer;
  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
  }
 
  function escapeHTML(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
 
  const CORRECT_PIN = '999999999';
const pinEl = document.createElement('div');
pinEl.id = 'pin-screen';
pinEl.style.cssText = 'position:fixed;inset:0;background:var(--warm-white);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-family:Prompt,sans-serif;';
pinEl.innerHTML = `
  <img src="logo.png" style="height:48px;object-fit:contain;margin-bottom:8px;"/>
  <div style="font-size:16px;font-weight:700;color:#1A1A1A;">กรุณาใส่รหัสผ่าน</div>
  <input id="pin-input" type="password" inputmode="numeric" maxlength="9"
    style="width:200px;text-align:center;font-size:24px;letter-spacing:0.2em;padding:12px;border:1.5px solid #E0D8C8;border-radius:12px;font-family:Prompt,sans-serif;"
    placeholder="•••••••••"/>
  <button onclick="checkPin()"
    style="background:#C9A84C;color:#fff;border:none;border-radius:40px;padding:12px 32px;font-family:Prompt,sans-serif;font-size:15px;font-weight:700;cursor:pointer;">
    เข้าสู่ระบบ
  </button>
  <div id="pin-error" style="color:#B33030;font-size:13px;display:none;">รหัสไม่ถูกต้อง</div>
`;
document.body.appendChild(pinEl);

function checkPin() {
  const input = document.getElementById('pin-input').value;
  if (input === CORRECT_PIN) {
    document.getElementById('pin-screen').remove();
    fetchMembers();
  } else {
    document.getElementById('pin-error').style.display = 'block';
    document.getElementById('pin-input').value = '';
  }
}

document.getElementById('pin-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkPin();
});
</script>
 
</body>
</html>
