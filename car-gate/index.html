<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>DC House — ระบบรถเข้า-ออก</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Cormorant:wght@300;400;500&family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet" />
 
  <style>
    /* ─── Design Tokens ─────────────────────────────────── */
    :root {
      --warm-white:   #FAF8F4;
      --cream:        #F4F0E8;
      --gold:         #C9A84C;
      --gold-light:   #E2C97E;
      --gold-dark:    #9E7A2E;
      --charcoal:     #1A1A1A;
      --ink:          #2C2C2C;
      --muted:        #888880;
      --divider:      #E0D8C8;
      --green-bg:     #EAF5EE;
      --green-text:   #2A7A4B;
      --red-bg:       #FAEAEA;
      --red-text:     #B33030;
      --card-shadow:  0 2px 24px rgba(0,0,0,0.06), 0 1px 4px rgba(0,0,0,0.04);
      --radius:       12px;
    }
 
    /* ─── Reset & Base ──────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
    html, body {
      font-family: 'Prompt', 'Cormorant Garamond', Georgia, sans-serif;
      background: var(--warm-white);
      color: var(--ink);
      min-height: 100vh;
    }
 
    /* ─── Header ────────────────────────────────────────── */
    header {
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      height: 76px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 0 var(--divider), 0 2px 16px rgba(0,0,0,0.06);
    }
 
    .header-logo {
      height: 56px;
      width: auto;
      object-fit: contain;
    }
 
    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
 
    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px;
      letter-spacing: 0.06em;
      color: var(--gold-dark);
      font-weight: 500;
    }
 
    .live-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #4CAF50;
      box-shadow: 0 0 0 0 rgba(76,175,80,0.6);
      animation: pulse 2s infinite;
    }
 
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(76,175,80,0.6); }
      70%  { box-shadow: 0 0 0 7px rgba(76,175,80,0); }
      100% { box-shadow: 0 0 0 0 rgba(76,175,80,0); }
    }
 
    /* ─── Main Layout ───────────────────────────────────── */
    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 36px 20px 60px;
    }
 
    /* ─── Subtitle bar ──────────────────────────────────── */
    .page-subtitle {
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 400;
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--divider);
    }
    .page-subtitle span { color: var(--gold); margin: 0 8px; }
 
    /* ─── Stat Cards ────────────────────────────────────── */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 32px;
    }
 
    .stat-card {
      border-radius: var(--radius);
      padding: 24px 28px;
      display: flex;
      align-items: center;
      gap: 18px;
      box-shadow: var(--card-shadow);
      transition: transform 0.18s ease;
    }
    .stat-card:hover { transform: translateY(-2px); }
 
    .stat-card.green { background: var(--green-bg); border: 1px solid #B8DEC6; }
    .stat-card.red   { background: var(--red-bg);   border: 1px solid #E8B8B8; }
 
    .stat-icon { font-size: 28px; flex-shrink: 0; }
 
    .stat-count {
      font-size: 42px;
      font-weight: 300;
      line-height: 1;
      letter-spacing: -0.02em;
    }
    .stat-card.green .stat-count { color: var(--green-text); }
    .stat-card.red   .stat-count { color: var(--red-text); }
 
    .stat-label-en {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.65;
      margin-top: 2px;
    }
    .stat-label-th {
      font-size: 15px;
      font-weight: 500;
      line-height: 1.3;
    }
    .stat-card.green .stat-label-th { color: var(--green-text); }
    .stat-card.red   .stat-label-th { color: var(--red-text); }
 
    /* ─── Section Header ────────────────────────────────── */
    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 14px;
    }
 
    .section-title {
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--charcoal);
    }
    .section-title-en {
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-left: 10px;
    }
 
    .last-updated {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.05em;
    }
 
    /* ─── Car List ──────────────────────────────────────── */
    .car-list {
      background: #fff;
      border-radius: var(--radius);
      border: 1px solid var(--divider);
      overflow: hidden;
      box-shadow: var(--card-shadow);
      margin-bottom: 32px;
    }
 
    .car-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 22px;
      border-bottom: 1px solid var(--divider);
      transition: background 0.15s;
    }
    .car-item:last-child { border-bottom: none; }
    .car-item:hover { background: var(--cream); }
 
    .car-svg { flex-shrink: 0; opacity: 0.75; }
 
    .car-info { flex: 1; min-width: 0; }
 
    .car-name {
      font-size: 19px;
      font-weight: 500;
      color: var(--charcoal);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
 
    .car-plate {
      font-size: 34px;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-top: 2px;
      font-style: italic;
    }
 
    .car-status {
      flex-shrink: 0;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 20px;
    }
    .car-status.in  { background: var(--green-bg); color: var(--green-text); border: 1px solid #B8DEC6; }
    .car-status.out { background: var(--red-bg);   color: var(--red-text);   border: 1px solid #E8B8B8; }
 
    /* Loading / empty state */
    .loading-row {
      padding: 40px;
      text-align: center;
      color: var(--muted);
      font-size: 15px;
      font-style: italic;
    }
 
    /* ─── Services ──────────────────────────────────────── */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px;
    }
 
    .service-card {
      background: #fff;
      border: 1px solid var(--divider);
      border-radius: var(--radius);
      padding: 20px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.18s ease;
      box-shadow: var(--card-shadow);
      text-decoration: none;
      color: inherit;
    }
    .service-card:hover {
      border-color: var(--gold);
      box-shadow: 0 4px 20px rgba(201,168,76,0.15);
      transform: translateY(-2px);
    }
 
    .service-inner { display: flex; align-items: center; gap: 12px; }
    .service-icon  { font-size: 22px; }
    .service-name-th { font-size: 15px; font-weight: 500; }
    .service-name-en { font-size: 11px; letter-spacing: 0.08em; color: var(--muted); margin-top: 1px; }
    .service-arrow { color: var(--gold); font-size: 18px; opacity: 0.7; }
 
    /* ─── Gold Divider ───────────────────────────────────── */
    .gold-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-light), transparent);
      margin: 32px 0;
    }
 
    /* ─── Footer ─────────────────────────────────────────── */
    footer {
      text-align: center;
      padding: 28px;
      font-size: 12px;
      letter-spacing: 0.1em;
      color: var(--muted);
      border-top: 1px solid var(--divider);
    }
 
    /* ─── Modal ──────────────────────────────────────────── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10,10,10,0.55);
      backdrop-filter: blur(4px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; }
 
    .modal {
      background: var(--warm-white);
      border-radius: 16px;
      width: 100%;
      max-width: 460px;
      padding: 36px 32px 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      position: relative;
      animation: slideUp 0.25s ease;
    }
 
    @keyframes slideUp {
      from { opacity:0; transform:translateY(20px); }
      to   { opacity:1; transform:translateY(0); }
    }
 
    .modal-close {
      position: absolute; top: 16px; right: 18px;
      background: none; border: none; cursor: pointer;
      font-size: 22px; color: var(--muted);
      line-height: 1;
    }
 
    .modal-title {
      font-size: 24px; font-weight: 500;
      color: var(--charcoal);
      margin-bottom: 4px;
    }
    .modal-subtitle {
      font-size: 13px; color: var(--muted);
      letter-spacing: 0.05em;
      margin-bottom: 24px;
    }
 
    .area-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 22px;
    }
 
    .area-btn {
      background: #fff;
      border: 1px solid var(--divider);
      border-radius: 8px;
      padding: 12px 14px;
      text-align: left;
      cursor: pointer;
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px;
      transition: all 0.15s;
    }
    .area-btn:hover { border-color: var(--gold); background: #fffdf7; }
    .area-btn.selected { border-color: var(--gold); background: #FBF6E8; color: var(--gold-dark); }
    .area-btn span { display: block; font-size: 18px; margin-bottom: 4px; }
 
    .problem-textarea {
      width: 100%;
      border: 1px solid var(--divider);
      border-radius: 8px;
      padding: 12px 14px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 15px;
      resize: none;
      height: 90px;
      background: #fff;
      color: var(--ink);
      margin-bottom: 18px;
      transition: border-color 0.15s;
    }
    .problem-textarea:focus { outline: none; border-color: var(--gold); }
 
    .send-btn {
      width: 100%;
      background: var(--gold);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 16px;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: background 0.18s;
    }
    .send-btn:hover { background: var(--gold-dark); }
 
    /* ─── Login Screen ──────────────────────────────────── */
    #login-screen {
      position: fixed; inset: 0;
      background: var(--warm-white);
      z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px;
    }
    .login-logo   { height: 56px; object-fit: contain; margin-bottom: 6px; }
    .login-title  { font-size: 20px; font-weight: 700; color: var(--charcoal); letter-spacing: .04em; }
    .login-sub    { font-size: 13px; color: var(--muted); margin-top: -6px; }
    .login-input  {
      width: 220px; text-align: center;
      font-size: 28px; letter-spacing: .22em;
      padding: 13px; border: 1.5px solid var(--divider);
      border-radius: var(--radius); font-family: 'Prompt', sans-serif;
      background: #fff; transition: border-color .15s;
    }
    .login-input:focus { outline: none; border-color: var(--gold); }
    .login-btn {
      background: var(--gold); color: #fff; border: none;
      border-radius: 40px; padding: 12px 40px;
      font-family: 'Prompt', sans-serif; font-size: 15px; font-weight: 700;
      cursor: pointer; box-shadow: 0 4px 16px rgba(201,168,76,.35);
      transition: all .18s;
    }
    .login-btn:active { transform: scale(.96); background: var(--gold-dark); }
    .login-error { color: var(--red-text); font-size: 13px; display: none; }

    /* ─── Responsive ─────────────────────────────────────── */
    @media (max-width: 540px) {
      header { padding: 0 16px; height: 64px; }
      .header-logo { height: 44px; }
      main { padding: 24px 14px 50px; }
      .stats-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
      .stat-card { padding: 18px 16px; gap: 12px; }
      .stat-count { font-size: 34px; }
      .car-item { padding: 14px 16px; gap: 12px; }
      .modal { padding: 28px 20px 22px; }
      .area-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<!-- ── LOGIN SCREEN ──────────────────────────────────────── -->
<div id="login-screen">
  <img src="logo.png" class="login-logo" alt="DC House"
       onerror="this.src='/car-gate/logo.png';this.onerror=function(){this.style.display='none'}">
  <div class="login-title">DC House</div>

  <!-- Invite code form — shown on first visit or new device -->
  <div id="ls-register" style="display:none;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:280px">
    <div class="login-sub" style="text-align:center">ใส่รหัสเชิญเพื่อเข้าใช้งาน<br>
      <small>Enter your invite code</small></div>
    <input id="reg-code" class="login-input" type="text"
           style="font-size:17px;letter-spacing:.12em;width:100%"
           placeholder="รหัสเชิญ" autocapitalize="characters" autocomplete="off"
           oninput="onCodeInput()">
    <input id="reg-name" class="login-input" type="text"
           style="font-size:16px;letter-spacing:0;width:100%"
           placeholder="ชื่อของคุณ (เช่น คุณแม่)">
    <button class="login-btn" style="width:100%" onclick="loginWithCode()">เข้าสู่ระบบ</button>
    <div class="login-error" id="reg-error" style="text-align:center"></div>
  </div>
</div>


<!-- ═══════════════════════════════════════
     HEADER
═══════════════════════════════════════ -->
<header>
  <!--
    LOGO IMAGE — replace "logo.png" with your actual logo filename/path.
    The PNG has a grey background; on this dark charcoal header it will
    look fine as-is. If you want it seamless, open in Photoshop/Canva and
    export with a transparent background, then the img will float perfectly.
    Hosted on GitHub Pages, put logo.png in the same /car-gate/ folder and
    use src="logo.png"
  -->
  <img
    src="logo.png"
    alt="DC House — ระบบเข้า-ออก"
    class="header-logo"
  />
 
  <div class="header-right">
    <button id="back-to-line-btn" onclick="goBackToLine()" style="
      display:none;background:transparent;border:1px solid var(--divider);
      border-radius:20px;padding:6px 14px;font-family:'Prompt',sans-serif;
      font-size:12px;color:var(--muted);cursor:pointer;">
      ← LINE
    </button>
    <div class="live-badge">
      <div class="live-dot"></div>
      Live
    </div>
  </div>
</header>
 
 
<!-- ═══════════════════════════════════════
     MAIN CONTENT
═══════════════════════════════════════ -->
<main>
 
  <p class="page-subtitle">
    DC House<span>·</span>ระบบรถเข้า-ออก<span>·</span>Car Gate System
  </p>
 
  <!-- Stat Cards -->
  <div class="stats-grid">
    <div class="stat-card green">
      <div class="stat-icon">🟢</div>
      <div>
        <div class="stat-count" id="count-in">—</div>
        <div class="stat-label-th">รถอยู่ในบ้าน</div>
        <div class="stat-label-en">Cars Inside</div>
      </div>
    </div>
    <div class="stat-card red">
      <div class="stat-icon">🔴</div>
      <div>
        <div class="stat-count" id="count-out">—</div>
        <div class="stat-label-th">รถออกไปแล้ว</div>
        <div class="stat-label-en">Cars Out</div>
      </div>
    </div>
  </div>
 
  <!-- Car List -->
  <div class="section-header">
    <div>
      <span class="section-title">รายการรถ</span>
      <span class="section-title-en">All Vehicles</span>
    </div>
    <div class="last-updated" id="last-updated">อัพเดตล่าสุด —</div>
  </div>
 
  <div class="car-list" id="car-list">
    <div class="loading-row">กำลังโหลด · Loading…</div>
  </div>
 
  <div class="gold-divider"></div>
 
</main>
 
 
<!-- ═══════════════════════════════════════
     FOOTER
═══════════════════════════════════════ -->
<footer>
  DC House · Family System · ลิขสิทธิ์ครอบครัว
</footer>
 
 
<!-- ═══════════════════════════════════════
     JAVASCRIPT
═══════════════════════════════════════ -->
<script>
  /* ─── CONFIG ──────────────────────────────────────────── */
  const PROXY_URL  = 'https://dc-house.vercel.app/api/cars';
  const SECRET_KEY = 'dc-house-2026';
 
  const REFRESH_INTERVAL = 5 * 1000;
 
  /* ─── SVG CAR ICON ────────────────────────────────────── */
  function carSVG(color) {
    return `
    <svg class="car-svg" width="48" height="28" viewBox="0 0 48 28" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="6" y="10" width="36" height="12" rx="3" fill="${color}" opacity="0.15"/>
      <path d="M10 10 L14 4 H34 L38 10" stroke="${color}" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
      <rect x="6" y="10" width="36" height="12" rx="3" stroke="${color}" stroke-width="1.8" fill="none"/>
      <circle cx="14" cy="23" r="3.5" fill="${color}" opacity="0.9"/>
      <circle cx="34" cy="23" r="3.5" fill="${color}" opacity="0.9"/>
      <circle cx="14" cy="23" r="1.5" fill="white"/>
      <circle cx="34" cy="23" r="1.5" fill="white"/>
      <rect x="16" y="5" width="8" height="5" rx="1" fill="${color}" opacity="0.35"/>
      <rect x="25" y="5" width="8" height="5" rx="1" fill="${color}" opacity="0.35"/>
    </svg>`;
  }
 
  /* ─── RENDER CARS ─────────────────────────────────────── */
function renderCars(cars) {
    const list = document.getElementById('car-list');

    if (!cars.length) {
      list.innerHTML = '<div class="loading-row">ไม่พบข้อมูล · No data found</div>';
      return;
    }

    let countIn = 0, countOut = 0;

    const groups = [
      { label: 'รถสาธารณะ', start: 0,  end: 15 },
      { label: 'รถ เจน 2',  start: 16, end: 23 },
      { label: 'รถ เจน 3',  start: 24, end: 33 },
    ];

    const html = groups.map(g => {
      const slice = cars.slice(g.start, g.end + 1).filter(c => c.name);
      const rows = slice.map(car => {
        const isIn      = car.status === 'in';
        const color     = isIn ? '#2A7A4B' : '#B33030';
        const statusTxt = isIn ? 'อยู่' : 'ไม่อยู่';
        const statusCls = isIn ? 'in' : 'out';
        if (isIn) countIn++; else countOut++;

        return `
          <div class="car-item">
            <img src="${escapeHTML(car.photo || '')}" onerror="this.style.display='none'"
              style="width:56px;height:40px;object-fit:contain;border-radius:6px;flex-shrink:0;border:2px solid ${color};"/>
            <div class="car-info">
              <div class="car-name">${escapeHTML(car.name)}</div>
              <div class="car-plate">${escapeHTML(car.plate)}</div>
            </div>
            <div class="car-status ${statusCls}">${statusTxt}</div>
          </div>`;
      }).join('');

      return `
        <div style="border:1px solid var(--divider);border-radius:var(--radius);overflow:hidden;margin-bottom:24px;">
          <div style="background:var(--cream);padding:10px 22px;font-size:13px;font-weight:700;letter-spacing:0.08em;color:var(--charcoal);border-bottom:1px solid var(--divider);">
            ${g.label}
          </div>
          ${rows}
        </div>`;
    }).join('');

    list.innerHTML = html;

    document.getElementById('count-in').textContent  = countIn;
    document.getElementById('count-out').textContent = countOut;

    const now = new Date();
    const timeStr = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('last-updated').textContent = `อัพเดต ${timeStr}`;
  }
 
  /* ─── FETCH VIA APPS SCRIPT PROXY ────────────────────── */
  async function fetchData() {
    try {
      const res  = await fetch(`${PROXY_URL}?key=${SECRET_KEY}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      renderCars(data.cars);
    } catch (err) {
      console.error('DC House fetch error:', err);
      document.getElementById('car-list').innerHTML =
        `<div class="loading-row">⚠️ ไม่สามารถโหลดข้อมูลได้ · Unable to load data<br><small style="color:#aaa">${err.message}</small></div>`;
    }
  }
 
  /* ─── HELPER ──────────────────────────────────────────── */
  function escapeHTML(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
 
  /* ─── MODAL ───────────────────────────────────────────── */
  let selectedArea = '';
 
  function openModal()  { document.getElementById('modal-overlay').classList.add('open'); }
  function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
 
  function handleOverlayClick(e) {
    if (e.target === document.getElementById('modal-overlay')) closeModal();
  }
 
  function selectArea(btn, area) {
    document.querySelectorAll('.area-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedArea = area;
  }
 
  function sendReport() {
    const text = document.getElementById('problem-text').value.trim();
    if (!selectedArea && !text) {
      alert('กรุณาเลือกบริเวณหรือใส่รายละเอียด\nPlease select an area or describe the problem.');
      return;
    }
    const msg = `🏠 DC House — รายงานปัญหา\n📍 ${selectedArea || 'ไม่ระบุบริเวณ'}\n📝 ${text || '(ไม่มีรายละเอียด)'}`;
    const encoded = encodeURIComponent(msg);
    // LINE URL scheme — opens LINE and pre-fills message (requires LINE installed)
    window.open(`https://line.me/R/msg/text/?${encoded}`, '_blank');
    closeModal();
  }
 
  /* ════════════════════════════════════════════════════════
     SESSION AUTH — invite code + localStorage
     First visit  → enter code → name auto-fills → tap เข้าสู่ระบบ → saved
     Return visit → go straight in (no prompt)
  ════════════════════════════════════════════════════════ */

  const SESSION_KEY = 'dc-session-v1';

  function getSession() {
    try { return JSON.parse(localStorage.getItem(SESSION_KEY)); }
    catch { return null; }
  }
  function saveSession(s) { localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }
  function clearSession()  { localStorage.removeItem(SESSION_KEY); sessionStorage.removeItem('dc-valid'); }

  // Per-person invite codes — value is the pre-filled display name
  const INVITE_CODES = {
    'DCH-DAM26': 'คุณดำรงค์',
    'DCH-KIT26': 'คุณกิตติ',
    'DCH-NAM26': 'คุณน้ำผึ้ง',
    'DCH-CHA26': 'คุณชรินทร์',
    'DCH-NIP26': 'คุณนิพนธ์',
    'DCH-BEN26': 'คุณเบญจมาศ',
    'DCH-NIT26': 'คุณนิทัศน์',
    'DCH-SUR26': 'คุณสุรีย์พร',
    'DCH-NIR26': 'คุณนิรันดร์',
    'DCH-SIP26': 'คุณศิริพร',
    'DCH-THE26': 'คุณธีรพล',
    'DCH-NTH26': 'คุณนิติพัทญ์',
    'DCH-SAY26': 'คุณสญาค์มณท์',
    'DCH-SPE26': 'คุณศิริเพ็ญ',
    'DCH-FLK26': 'คุณณัชชา ฟลุ๊ค',
    'DCH-BEL26': 'คุณศรัณย์ญา เบล',
    'DCH-FUN26': 'คุณณัฐธิดา ฝัน',
    'DCH-BOT26': 'คุณญาณินท์ โบ๊ท',
    'DCH-FAR26': 'คุณณัฐฐินี เเฟร์',
    'DCH-BEM26': 'คุณติณณภพ บีม',
    'DCH-JOB26': 'คุณจิรายุ จ๊อบ',
    'DCH-BAM26': 'คุณนิชกานต์ เเบม',
    'DCH-JAB26': 'คุณพิชญุตม์ เเจ๊บบี้',
    'DCH-JEF26': 'คุณชานน เจฟ',
    'DCH-NEY26': 'คุณชาลิสา เนย',
    'DCH-JR026': 'คุณศิววงศ์ เจอาร์',
    'DCH-MUK26': 'คุณภูษณิศา มุก',
    'DCH-GRC26': 'คุณพัทธ์ธีญา เกรซ',
    'DCH-NOY26': 'คุณพริสา นอยนอย',
    'DCH-JT226': 'คุณณภัทร์ เจทู',
    'DCH-LIS26': 'คุณเมญ์ลิสษา ลิสา',
    'DCH-MAX26': 'คุณสุวพัฎช์ เเมกซ์',
    'DCH-TAN26': 'คุณธัญยธรณ์ ธัญญา',
    'DCH-MRK26': 'คุณชินพัฒศ์ มาร์ค',
    'DCH-DAN26': 'คุณแดนนธีรรุ์ แดนนี่',
    'DCH-WAW26': 'คุณกุณฑิกา วาวา',
    'DCH-PIT26': 'คุณพชร พีท',
    'DCH-NTP26': 'คุณณัฐพงศ์ ณัฐ',
    'DCH-MTW26': 'คุณแมธธิว แมธ',
    'DCH-AEM26': 'คุณบุณยวีร์ แอ๋ม',
  };

  // LINE user ID passed via deeplink (?lid=...) — used to auto-register for courier
  let _lineUserId = '';

  function goBackToLine() {
    window.location.href = 'line://';
  }

  // Auto-fill name when a valid code is typed/pasted
  function onCodeInput() {
    const code = document.getElementById('reg-code').value.trim().toUpperCase();
    const nameEl = document.getElementById('reg-name');
    const mapped = INVITE_CODES[code];
    if (mapped) nameEl.value = mapped;
  }

  // ── Enter main app ────────────────────────────────────────
  let _refreshTimer;

  function enterApp() {
    document.getElementById('login-screen').style.display = 'none';

    if (_lineUserId) {
      document.getElementById('back-to-line-btn').style.display = 'inline-block';
    }

    fetchData();
    _refreshTimer = setInterval(fetchData, REFRESH_INTERVAL);
  }

  // ── First-time login with invite code ────────────────────
  function loginWithCode() {
    const code  = document.getElementById('reg-code').value.trim().toUpperCase();
    const name  = document.getElementById('reg-name').value.trim();
    const errEl = document.getElementById('reg-error');
    errEl.style.display = 'none';

    if (!_lineUserId) {
      errEl.textContent = 'กรุณาเปิดลิงก์จาก LINE ค่ะ / Please open via LINE';
      errEl.style.display = 'block'; return;
    }
    if (!INVITE_CODES[code]) {
      errEl.textContent = 'รหัสเชิญไม่ถูกต้อง / Invalid invite code';
      errEl.style.display = 'block'; return;
    }
    if (!name) {
      errEl.textContent = 'กรุณาใส่ชื่อ / Please enter your name';
      errEl.style.display = 'block'; return;
    }

    saveSession({ name, code, lineUserId: _lineUserId, loginAt: new Date().toISOString() });

    // Always register for courier list; pass LINE ID if we have it
    fetch(`${PROXY_URL}?key=${SECRET_KEY}&action=registerMember`
      + `&memberName=${encodeURIComponent(name)}`
      + (_lineUserId ? `&lineUserId=${encodeURIComponent(_lineUserId)}` : ''))
      .catch(() => {});

    enterApp();
  }

  // ── Init ─────────────────────────────────────────────────
  async function initAuth() {
    const params  = new URLSearchParams(location.search);
    _lineUserId   = params.get('lid') || '';
    const urlCode = params.get('code');

    if (urlCode) {
      document.getElementById('reg-code').value = urlCode.toUpperCase();
      onCodeInput();
    }

    const session = getSession();
    if (session && session.name) {
      // Returning user via LINE deeplink — upgrade their registration with LINE ID if missing
      if (_lineUserId && !session.lineUserId) {
        session.lineUserId = _lineUserId;
        saveSession(session);
        fetch(`${PROXY_URL}?key=${SECRET_KEY}&action=registerMember`
          + `&memberName=${encodeURIComponent(session.name)}&lineUserId=${encodeURIComponent(_lineUserId)}`)
          .catch(() => {});
      }

      // Must have a LINE ID — no LINE ID means not properly registered
      if (!session.lineUserId) {
        clearSession();
        document.getElementById('ls-register').style.display = 'flex';
        return;
      }

      // Check sessionStorage cache (5 min) before hitting the API
      try {
        const cached = JSON.parse(sessionStorage.getItem('dc-valid') || 'null');
        if (cached && Date.now() - cached.ts < 5 * 60 * 1000 && cached.uid === session.lineUserId) {
          if (cached.ok) { enterApp(); return; }
          clearSession();
          document.getElementById('ls-register').style.display = 'flex';
          return;
        }
      } catch {}

      // Validate LINE user ID is still in the Members sheet
      try {
        const res  = await fetch(`${PROXY_URL}?key=${SECRET_KEY}&action=getMembers`);
        const data = await res.json();
        const valid = !!(data.members && data.members.some(m => m.userId === session.lineUserId));
        sessionStorage.setItem('dc-valid', JSON.stringify({ ts: Date.now(), uid: session.lineUserId, ok: valid }));
        if (!valid) {
          clearSession();
          document.getElementById('ls-register').style.display = 'flex';
          return;
        }
      } catch {
        // Network error — fail open so the app still works offline
      }

      enterApp();
      return;
    }

    document.getElementById('ls-register').style.display = 'flex';
  }

  /* ─── INIT ────────────────────────────────────────────── */
  initAuth();
  // fetchData / setInterval called by enterApp() — not on page load
</script>
